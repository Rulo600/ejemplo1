<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayGames - Login</title>
    <link rel="stylesheet" href="css/LoginEstilo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        
    </style>
</head>

<body>
    <main>
        <section class="contenedor-login" id="contenedorLogin">
            <article class="zona-formularios">
                <form class="formulario formulario-login" id="formLogin">
                    <h1>Iniciar Sesion</h1>

                    <div class="campo">
                        <label for="loginUser">Usuario</label>
                        <input type="text" id="loginUser" autocomplete="username" required>
                    </div>

                    <div class="campo">
                        <label for="loginPass">Contraseña</label>
                        <input type="password" id="loginPass" autocomplete="current-password" required>
                    </div>

                    <p class="mensaje" id="mensajeLogin"></p>

                    <button type="submit">Entrar</button>
                </form>

                <form class="formulario formulario-registro" id="formRegistro">
                    <h1>Registrarse</h1>

                    <div class="campo">
                        <label for="registroUser">Usuario</label>
                        <input type="text" id="registroUser" autocomplete="username" required>
                    </div>

                    <div class="campo">
                        <label for="registroPass">Contraseña</label>
                        <input type="password" id="registroPass" autocomplete="new-password" required>
                    </div>

                    <div class="campo">
                        <label for="registroPass2">Repetir contraseña</label>
                        <input type="password" id="registroPass2" autocomplete="new-password" required>
                    </div>

                    <p class="mensaje" id="mensajeRegistro"></p>

                    <button type="submit">Crear cuenta</button>
                </form>
            </article>

            <article class="panel-cambio">
                <section class="panel panel-login">
                    <i class="fa-solid fa-gamepad"></i>
                    <h2>Bienvenido</h2>
                    <p>Crea tu usuario y empieza con una sesion nueva.</p>
                    <button type="button" id="abrirRegistro">Registrarse</button>
                </section>

                <section class="panel panel-registro">
                    <i class="fa-solid fa-user-plus"></i>
                    <h2>Nueva cuenta</h2>
                    <p>Entra con tu cuenta para volver a Gameria.</p>
                    <button type="button" id="abrirLogin">Iniciar sesion</button>
                </section>
            </article>
        </section>
    </main>

    <script src="javascript/js_Login.js"></script>
</body>
</html>
