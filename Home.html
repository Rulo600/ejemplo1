<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayGames</title>
    <link rel="stylesheet" href="css/ProyectoFinal_estilo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <header>
        <i class="fa-solid fa-user" id="login"></i>
        <article class="bbteca">Biblioteca<i class="fa-solid fa-book"></i></article>
        <div class="fondobbteca">
            <div class="bbtecamodal">
                <section class="zonasuperior"></section>
                <section class="zonainferior">
                    <div class="botonsalir2">Salir</div>
                </section>
            </div>
        </div>
        <section class="zonadinero">
            <article class="cartera">Cartera<i class="fa-solid fa-sack-dollar"></i></article>
            <h2 class="saldovisible"></h2>
        </section>
        <div class="fondocartera">
            <div class="carteramodal">
                <section class="zonasuperior2">
                    <section class="zonasaldo">
                        <h2>Saldo</h2>
                        <input class="saldo" type="number" readonly>
                    </section>
                    <section class="zonaingresos">
                        <h2>Ingresos</h2>
                        <input class="ingresos" type="number" placeholder="Inserte su cantidad a ingresar aqui">
                    </section>
                    <h3 class="textocartera"></h3>
                </section>
                <section class="zonainferior2">
                    <div class="botonsalir3">Salir</div>
                    <select name="moneda" class="moneda">
                        <option value="€">Euros</option>
                        <option value="£">Libras</option>
                        <option value="$">Dolares</option>
                    </select>
                    <div class="botoningresar">Ingresar</div>
                </section>
            </div>
        </div>
    </header>
    <main>
        <div id="fondojuegos">
            <div class="juegosmodal"></div>
        </div>
        <section class="primero">
            
            <h1>ACCION</h1>
            <article class="juegos" id="a1"
            data-nombre="Helldivers 2"
            data-trailer="indexVideos/Helldivers 2 _ Tráiler de anuncio.mp4"
            data-descripcion="Helldivers 2 es un shooter cooperativo en tercera persona frenético y satírico, desarrollado por Arrowhead Game Studios. Los jugadores encarnan a soldados de élite (Helldivers) que defienden la Supertierra contra amenazas alienígenas y robóticas, destacando por su intenso combate, estrategia en equipo, fuego amigo y un tono de humor negro."
            data-precio="Precio: 39.99€"
            data-imagen="indexImagenes/helldivers2(1).jpg"
            data-valor="39.99"></article>
            
            <article class="juegos" id="a2"
            data-nombre="ARC Raiders"
            data-trailer="indexVideos/ARC Raiders - Launch Trailer _ PS5 Games.mp4"
            data-descripcion="ARC Raiders es un shooter de extracción multijugador en tercera persona, ambientado en un mundo postapocalíptico donde la humanidad lucha contra máquinas letales llamadas ARC. Los jugadores son Raiders que exploran la superficie para conseguir recursos valiosos, sobrevivir a los robots enemigos y extraer botines en partidas tensas."
            data-precio="Precio: 39.99€"
            data-imagen="indexImagenes/arc raiders.png"
            data-valor="39.99"></article>
            
            <article class="juegos" id="a3"
            data-nombre="Warframe"
            data-trailer="indexVideos/Warframe _ Official Cinematic Trailer 2021 _ The New War_ Expansion Story and Date Reveal.mp4"
            data-descripcion="Warframe es un shooter de acción cooperativo en tercera persona (PvE) y estilo looter-shooter, donde controlas a los Tenno, guerreros ancestrales que utilizan trajes biomecánicos (Warframes) con habilidades únicas para luchar en un sistema solar de ciencia ficción. El juego destaca por su alta velocidad, agilidad, parkour espacial y una inmensa cantidad de contenido gratuito, enfocándose en la personalización, exploración y combate masivo contra varias facciones."
            data-precio="Precio: Free to play"
            data-imagen="indexImagenes/warframe.jpg"
            data-valor="0"></article>

            <article class="juegos" id="a4"
            data-nombre="Metro Exodus"
            data-trailer="indexVideos/metro exodus trailer.mp4"
            data-descripcion="Metro Exodus es un shooter en primera persona inmersivo que combina acción, sigilo, supervivencia y terror en un mundo postapocalíptico ruso. Basado en las novelas de Dmitry Glukhovsky, el protagonista Artiom viaja en tren (el Aurora) a través de un año entero, explorando inmensos escenarios no lineales (sandbox) en la superficie, abandonando los túneles del metro."
            data-precio="Precio: 29.99€"
            data-imagen="indexImagenes/metroexodus.png"
            data-valor="29.99"></article>

            <article class="juegos" id="a5"
            data-nombre="Cyberpunk 2077"
            data-trailer="indexVideos/Cyberpunk 2077 — Tráiler de lanzamiento — V.mp4"
            data-descripcion="Cyberpunk 2077 es un RPG de acción y aventura en mundo abierto ambientado en Night City, una megalópolis distópica obsesionada con el poder, el glamur y la modificación corporal. Encarnando a V, un mercenario personalizable, el jugador lucha por la supervivencia en una ciudad controlada por corporaciones y bandas, con una trama intensa que explora temas de transhumanismo y crisis de identidad."
            data-precio="Precio: 59.99€"
            data-imagen="indexImagenes/cyberpunk-2077.jpg"
            data-valor="59.99"></article>

            <article class="juegos" id="a6"
            data-nombre="Horizon Zero Dawn"
            data-trailer="indexVideos/Horizon_ Zero Dawn _ Tráiler Cinemático en Español.mp4"
            data-descripcion="Horizon Zero Dawn es un aclamado videojuego de rol y acción en tercera persona, lanzado en 2017 por Guerrilla Games, ambientado en un mundo postapocalíptico donde las máquinas dominan la tierra. La historia sigue a Aloy, una cazadora marginada que busca respuestas sobre su pasado, su origen y el misterio de las máquinas mientras explora un vibrante mundo abierto."
            data-precio="Precio: 49.99€"
            data-imagen="indexImagenes/horizon zero dawn.jpg"
            data-valor="49.99"></article>

            <article class="juegos" id="a7"
            data-nombre="Pragmata"
            data-trailer="indexVideos/pragmata trailer.mp4"
            data-descripcion="Pragmata es un videojuego de acción y aventura narrativa de ciencia ficción, desarrollado por Capcom para PS5, Xbox Series X/S, PC y Nintendo Switch 2 (lanzado en 2026). Ambientado en una estación de investigación lunar distópica, sigue a Hugh, un astronauta, y Diana, una niña androide, intentando sobrevivir a una IA descontrolada y volver a la Tierra."
            data-precio="Precio: 59.99€"
            data-imagen="indexImagenes/pragmata.jpg"
            data-valor="59.99"></article>

            <article class="juegos" id="a8"
            data-nombre="Red Dead Redemption 2"
            data-trailer="indexVideos/Red Dead Redemption 2_ Tráiler 2 Oficial.mp4"
            data-descripcion="Red Dead Redemption 2 (RDR2) es un aclamado videojuego de acción-aventura western, desarrollado por Rockstar Games y ambientado en 1899. Narra la historia de Arthur Morgan y la banda de Dutch van der Linde, quienes luchan por sobrevivir al fin del Salvaje Oeste, perseguidos por agentes federales en un inmenso mundo abierto."
            data-precio="Precio: 59.99€"
            data-imagen="indexImagenes/rdr2.jpg"
            data-valor="59.99"></article>
        </section>
        <section class="segundo">
            <h1>HORROR</h1>
            <article class="juegos" id="h1"
            data-nombre="Dead Space Remake"
            data-trailer="indexVideos/Dead Space Remake - Official Reveal Trailer _ EA Play Live.mp4"
            data-descripcion="El Dead Space Remake (2023) es una reconstrucción total del clásico survival horror de 2008, desarrollada por EA Motive para PC, PS5 y Xbox Series. Ofrece una experiencia inmersiva con gráficos de nueva generación (Frostbite engine), audio 3D mejorado, sin pantallas de carga y una narrativa ampliada donde el protagonista, Isaac Clarke, ahora tiene voz."
            data-precio="Precio: 59.99€"
            data-imagen="indexImagenes/dead space.jpg"
            data-valor="59.99"></article>

            <article class="juegos" id="h2"
            data-nombre="Metro 2033 Redux"
            data-trailer="indexVideos/Metro Redux - Launch Trailer.mp4"
            data-descripcion="Metro 2033 Redux es la versión remasterizada y mejorada del shooter de culto postapocalíptico, desarrollada por 4A Games. Reconstruido en el motor más avanzado de Last Light, ofrece gráficos mejorados, jugabilidad refinada, IA superior y dos estilos de juego distintos (Supervivencia y Espartano), convirtiéndolo en la experiencia definitiva de la aventura original."
            data-precio="Precio: 19.99€"
            data-imagen="indexImagenes/metro233(1).jpg"
            data-valor="19.99"></article>

            <article class="juegos" id="h3"
            data-nombre="Little Nightmares"
            data-trailer="indexVideos/Little Nightmares - Launch Trailer.mp4"
            data-descripcion="Little Nightmares es un videojuego de plataformas y rompecabezas de terror y suspense, donde controlas a Six, una niña pequeña con un impermeable amarillo que intenta escapar de «Las Fauces», un inmenso y misterioso navío habitado por monstruos grotescos que buscan devorarla. Destaca por su atmósfera opresiva, estética macabra y narrativa visual sin diálogos."
            data-precio="Precio: 19.99€"
            data-imagen="indexImagenes/Little_Nightmares_Box_Art.png"
            data-valor="19.99"></article>

            <article class="juegos" id="h4"
            data-nombre="Five Nights at Freddy's 4"
            data-trailer="indexVideos/Five Nights at Freddy's 4 Trailer.mp4"
            data-descripcion="Five Nights at Freddy's 4 (2015) es el cuarto capítulo de la saga de terror independiente, donde asumes el papel de un niño pequeño defendiéndose de versiones pesadillescas de Freddy, Bonnie, Chica y Foxy en su habitación. A diferencia de juegos anteriores, no hay cámaras ni puertas de seguridad; la supervivencia depende de escuchar la respiración y usar una linterna para repeler a los animatrónicos en la oscuridad."
            data-precio="Precio: 7.99€"
            data-imagen="indexImagenes/game--five-nights-at-freddys-4.webp"
            data-valor="7.99"></article>

            <article class="juegos" id="h5"
            data-nombre="Resident Evil 4 Remake"
            data-trailer="indexVideos/Resident Evil 4 Remake - Reveal Trailer _ PlayStation State of Play 2022.mp4"
            data-descripcion="Resident Evil 4 Remake (2023) es una reimaginación moderna del clásico de terror de supervivencia, desarrollada por Capcom para consolas actuales y PC. Combina acción intensa en tercera persona con una atmósfera lúgubre, gráficos fotorrealistas, narrativa actualizada y jugabilidad mejorada, manteniendo la esencia de rescatar a Ashley Graham en España."
            data-precio="Precio: 39.99€"
            data-imagen="indexImagenes/Resident_Evil_4_remake_cover_art.jpg"
            data-valor="39.99"></article>

            <article class="juegos" id="h6"
            data-nombre="Outlast 2"
            data-trailer="indexVideos/PS4 - Outlast 2 Official Launch Trailer.mp4"
            data-descripcion="Outlast 2 es un videojuego de survival horror en primera persona desarrollado por Red Barrels, donde el jugador asume el rol de Blake Langermann, un cámara investigando la muerte de una embarazada en el desierto de Arizona. Se caracteriza por un alto nivel de tensión, persecuciones intensas y el uso de una cámara de vídeo con visión nocturna como única herramienta para sobrevivir."
            data-precio="Precio: 19.50€"
            data-imagen="indexImagenes/Outlast2.png"
            data-valor="19.50"></article>

            <article class="juegos" id="h7"
            data-nombre="Dredge"
            data-trailer="indexVideos/Dredge Preview Trailer.mp4"
            data-descripcion="Dredge es un videojuego de aventura y pesca con tintes de terror lovecraftiano desarrollado por Black Salt Games. El jugador controla a un pescador que explora un archipiélago misterioso, vendiendo capturas, mejorando su barco y enfrentándose a peligros sobrenaturales al anochecer."
            data-precio="Precio: 24.99€"
            data-imagen="indexImagenes/Dredge_Cover_Art.jpg"
            data-valor="24.99"></article>

            <article class="juegos" id="h8"
            data-nombre="The Forest"
            data-trailer="indexVideos/The Forest - Launch-Trailer.mp4"
            data-descripcion="The Forest es un videojuego de terror y supervivencia en primera persona, lanzado por Endnight Games en 2018 (PC/PS4). Eres Eric LeBlanc, único sobreviviente de un accidente aéreo en una península boscosa, que busca a su hijo secuestrado [Timmy] mientras enfrenta a una sociedad de mutantes caníbales. El juego destaca por su construcción de bases, exploración de cuevas y un fuerte ambiente de terror."
            data-precio="Precio: 16.79€"
            data-imagen="indexImagenes/TheForest_Game.jpg"
            data-valor="16.79"></article>
        </section>
        <section class="tercero">
            <h1>SUPERVIVENCIA</h1>
            <article class="juegos" id="s1"
            data-nombre="Sons Of The Forest"
            data-trailer="indexVideos/Sons of the Forest - Official Gameplay Trailer.mp4"
            data-descripcion="Sons of the Forest es un videojuego de terror y supervivencia en primera persona, secuela de The Forest, donde eres enviado a una isla remota para buscar a un multimillonario desaparecido. Destaca por su alta libertad, construcción detallada, sistemas de crafteo y enfrentamientos contra caníbales y mutantes en un mundo abierto."
            data-precio="Precio: 28.99€"
            data-imagen="indexImagenes/Sons_of_the_Forest.jpg"
            data-valor="28.99"></article>

            <article class="juegos" id="s2"
            data-nombre="Subnautica"
            data-trailer="indexVideos/Subnautica Cinematic Trailer.mp4"
            data-descripcion="Subnautica es un aclamado videojuego de aventura y supervivencia en mundo abierto, desarrollado por Unknown Worlds Entertainment, ambientado en un misterioso planeta oceánico alienígena, el 4546B. El jugador controla a un náufrago espacial que debe explorar profundidades, recolectar recursos, construir bases y sobrevivir a criaturas hostiles."
            data-precio="Precio: 29.99€"
            data-imagen="indexImagenes/subnauticacover.jpg"
            data-valor="29.99"></article>

            <article class="juegos" id="s3"
            data-nombre="Ark Survival Ascended"
            data-trailer="indexVideos/ARK Survival Ascended Trailer.mp4"
            data-descripcion="ARK: Survival Ascended (ASA) es una remasterización de nueva generación del clásico ARK: Survival Evolved, rediseñada por completo bajo el motor Unreal Engine 5. Ofrece una experiencia de supervivencia extrema en una isla misteriosa, donde los jugadores deben domesticar dinosaurios, construir bases, fabricar herramientas y luchar para sobrevivir, con gráficos de vanguardia y físicas mejoradas."
            data-precio="Precio: 44.99€"
            data-imagen="indexImagenes/asa.jpg"
            data-valor="44.99"></article>
            
            <article class="juegos" id="s4"
            data-nombre="Rust"
            data-trailer="indexVideos/Rust - Official Trailer.mp4"
            data-descripcion="Rust es un videojuego de supervivencia multijugador brutal, creado por Facepunch Studios, donde el único objetivo es mantenerse con vida en una isla postapocalíptica. Los jugadores deben recolectar recursos, construir bases, craftear herramientas y combatir tanto contra el entorno hostil (hambre, sed, frío) como contra otros jugadores en un entorno sandbox."
            data-precio="Precio: 39.99€"
            data-imagen="indexImagenes/rust.jpg"
            data-valor="39.99"></article>

            <article class="juegos" id="s5"
            data-nombre="Don't Starve"
            data-trailer="indexVideos/Don't Starve Gameplay Trailer (PS4).mp4"
            data-descripcion="Don't Starve es un implacable videojuego de supervivencia con estética gótica y elementos roguelike, donde el objetivo principal es sobrevivir el mayor tiempo posible en un mundo hostil, generado aleatoriamente. El jugador gestiona hambre, salud y cordura mientras explora, recolecta recursos y construye estructuras para no morir."
            data-precio="Precio: 8.19€"
            data-imagen="indexImagenes/Don't_Starve_cover.jpg"
            data-valor="8.19"></article>

            <article class="juegos" id="s6"
            data-nombre="No Man's Sky"
            data-trailer="indexVideos/No Man’s Sky - Launch Trailer _ PS4.mp4"
            data-descripcion="No Man's Sky es un videojuego de exploración, supervivencia y construcción en primera o tercera persona, ambientado en un universo procedural generado de forma infinita (18 quintillones de planetas). Los jugadores viajan sin pantallas de carga entre el espacio y la superficie de planetas únicos, recolectando recursos, comerciando, luchando y construyendo bases."
            data-precio="Precio: 58.99€"
            data-imagen="indexImagenes/no mans sky.jpg"
            data-valor="58.99"></article>

            <article class="juegos" id="s7"
            data-nombre="DayZ"
            data-trailer="indexVideos/DayZ trailer.mp4"
            data-descripcion="DayZ es un simulador de supervivencia extrema en mundo abierto, multijugador y postapocalíptico, donde el único objetivo es sobrevivir el mayor tiempo posible. Ambientado en un entorno post-soviético infectado, los jugadores deben gestionar necesidades básicas como hambre, sed y temperatura, buscando recursos mientras evitan zombies y otros jugadores hostiles."
            data-precio="Precio: 47.99€"
            data-imagen="indexImagenes/Day_Z_cover.jpg"
            data-valor="47.99"></article>

            <article class="juegos" id="s8"
            data-nombre="Minecraft"
            data-trailer="indexVideos/Official Minecraft Trailer.mp4"
            data-descripcion="Minecraft es un videojuego tipo sandbox (mundo abierto/caja de arena) de construcción y supervivencia, sin objetivos lineales obligatorios. Los jugadores exploran un mundo infinito de bloques, recolectan recursos, construyen estructuras y sobreviven a criaturas hostiles, fomentando la creatividad y la libertad total para crear."
            data-precio="Precio: 29.99€"
            data-imagen="indexImagenes/minecraft.jpg"
            data-valor="29.99"></article>
        </section>
    </main>
